name: Terra statistical JSON checks

on:
  pull_request:
    paths:
      - backend/terra_qc/**
      - backend/terra_monitoring/**
      - config/terra/**
      - docs/terra/**
      - tests/test_terra*.py
      - tests/fixtures/terra/**
      - web/**
      - requirements-terra*.txt
      - terra.py
      - COORDINATION.md
      - spec.md
      - .github/workflows/terra.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  statistical-json:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TERRA_BRANCH: ${{ github.head_ref || github.ref_name }}
      TERRA_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-terra-dev.txt
      - name: Validate scoped integration against the actual base
        shell: python
        run: |
          import os
          import subprocess
          import sys
          subprocess.run([sys.executable, '-B', 'terra.py', 'check',
                          '--base', os.environ['TERRA_BASE'], '--task', 'terra-qc-json'], check=True)
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: pnpm --dir web test:sites
