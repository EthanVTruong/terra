name: Chill monitor checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHILLWATCH_LGB_THREADS: '2'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,serial]'
      - run: python -m pip check
      - run: ruff check backend tests --exclude tests/test_terra_harness.py
      # includes the firmware test: the sketch is compiled with g++ against host stubs and its
      # serial output decoded by the backend (ubuntu-latest ships g++)
      - run: python -m pytest

  coordination:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHILLWATCH_LGB_THREADS: '2'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Scoped integration check against the actual base
        env:
          # CI checks out a detached merge commit; the task is found by its recorded branch
          TERRA_BRANCH: ${{ github.head_ref || github.ref_name }}
          TERRA_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python -B terra.py check --base "$TERRA_BASE"
