#   70 Manteca -> SCK Stockton, 71 Modesto -> MOD Modesto, 39 Parlier -> O32 Reedley.
season: "2025-26"
hill_near: MOD
faults:
  - {day: 10, station: SCK, type: outage, days: 6}
