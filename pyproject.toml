[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chillwatch"
version = "0.1.0"
description = "ChillWatch: QC, repair and estimation of California ag-weather station temperatures"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "matplotlib>=3.8",
  "pyarrow>=15",
  "httpx>=0.27",
  "tenacity>=8.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "typer>=0.12",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]
prism = ["rasterio>=1.3"]

[project.scripts]
chillwatch = "chillwatch.cli:app"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end replays (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.ruff.lint.per-file-ignores]
"backend/chillwatch/cli.py" = ["B008"]
